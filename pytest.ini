[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ringkas tapi informatif: tampilkan alasan skip dan ringkasan kegagalan.
addopts =
    -ra
    --strict-markers
    --tb=short

markers =
    api: menandai test yang memanggil Gemini API sungguhan (butuh kuota & API key)
