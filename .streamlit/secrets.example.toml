# Provider chat OpenAI-compatible (Bandel AI)
LLM_API_KEY = "your_bandel_api_key_here"
LLM_BASE_URL = "https://bandelbanget.xyz/v1"
LLM_MODEL = "deepseek-v4-flash"
UTILITY_MODEL = "deepseek-v4-flash"

# Provider embedding (Google AI Studio)
# Wajib berbeda dari LLM_API_KEY bila endpoint chat tidak menyediakan embeddings.
GEMINI_EMBEDDING_API_KEY = "your_google_gemini_embedding_key_here"

# Mode aplikasi:
# public   = untuk mahasiswa, hanya Tanya Jawab
# operator = UI internal lengkap untuk admin/pengembang
APP_MODE = "public"

# Rate limit per sesi Streamlit (public mode)
PUBLIC_RATE_LIMIT = 20
PUBLIC_RATE_WINDOW_SECONDS = 3600
